<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="calculator" id="calculator">
    <div class="display">
      <button class="settings-toggle" id="settings-toggle" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">⚙</button>
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel" inert aria-hidden="true">
      <div class="settings-header">
        <span>Settings</span>
        <button class="settings-close" id="settings-close" aria-label="Close settings">✕</button>
      </div>

      <div class="settings-group">
        <label class="settings-label">Theme</label>
        <div class="settings-options" id="theme-options">
          <button class="settings-option active" data-theme="dark">Dark</button>
          <button class="settings-option" data-theme="light">Light</button>
          <button class="settings-option" data-theme="solarized">Solarized</button>
        </div>
      </div>

      <div class="settings-group">
        <label class="settings-label">Decimal Places</label>
        <div class="settings-options" id="precision-options">
          <button class="settings-option active" data-precision="auto">Auto</button>
          <button class="settings-option" data-precision="2">2</button>
          <button class="settings-option" data-precision="4">4</button>
          <button class="settings-option" data-precision="6">6</button>
        </div>
      </div>

      <div class="settings-group">
        <label class="settings-label" id="separator-label" for="separator-toggle">Thousands Separator</label>
        <div class="settings-toggle-row">
          <span class="settings-desc">1,000,000</span>
          <label class="switch" for="separator-toggle">
            <input type="checkbox" id="separator-toggle" aria-labelledby="separator-label" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-group">
        <label class="settings-label" id="sound-label" for="sound-toggle">Sound</label>
        <div class="settings-toggle-row">
          <span class="settings-desc">Button click sound</span>
          <label class="switch" for="sound-toggle">
            <input type="checkbox" id="sound-toggle" aria-labelledby="sound-label" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn operator" data-action="clear">AC</button>
      <button class="btn operator" data-action="toggle-sign">+/−</button>
      <button class="btn operator" data-action="percent">%</button>
      <button class="btn accent"  data-action="divide">÷</button>

      <button class="btn" data-action="number" data-value="7">7</button>
      <button class="btn" data-action="number" data-value="8">8</button>
      <button class="btn" data-action="number" data-value="9">9</button>
      <button class="btn accent"  data-action="multiply">×</button>

      <button class="btn" data-action="number" data-value="4">4</button>
      <button class="btn" data-action="number" data-value="5">5</button>
      <button class="btn" data-action="number" data-value="6">6</button>
      <button class="btn accent"  data-action="subtract">−</button>

      <button class="btn" data-action="number" data-value="1">1</button>
      <button class="btn" data-action="number" data-value="2">2</button>
      <button class="btn" data-action="number" data-value="3">3</button>
      <button class="btn accent"  data-action="add">+</button>

      <button class="btn wide" data-action="number" data-value="0">0</button>
      <button class="btn" data-action="decimal">.</button>
      <button class="btn accent"  data-action="equals">=</button>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
